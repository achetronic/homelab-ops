# descheduler (kubernetes-sigs). Ref: https://github.com/kubernetes-sigs/descheduler
# Ref: https://artifacthub.io/packages/helm/descheduler/descheduler
#
# Rebalances pods across WORKER nodes: evicts from busy nodes so the scheduler
# replaces them on idle ones. Balancing uses real usage (metrics-server), not requests.

# Ref: https://github.com/kubernetes-sigs/descheduler/blob/master/charts/descheduler/values.yaml

kind: Deployment
replicas: 2

cmdOptions:
  client-connection-qps: 100.0
  client-connection-burst: 200
  logging-format: json
  v: 4

# Specifies whether Leader Election resources should be created
# Required when running as a Deployment
leaderElection:
  enabled: true
  leaseDuration: 15s
  renewDeadline: 10s
  retryPeriod: 2s
  resourceLock: "leases"
  resourceName: "descheduler"
  resourceNamespace: "kube-system"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - descheduler
        topologyKey: "kubernetes.io/hostname"

topologySpreadConstraints:
   - maxSkew: 1
     topologyKey: kubernetes.io/hostname
     whenUnsatisfiable: DoNotSchedule
     labelSelector:
       matchLabels:
         app.kubernetes.io/name: descheduler

deschedulerPolicy:
  # Workers only: masters are schedulable in this cluster but stay out of balancing.
  nodeSelector: "!node-role.kubernetes.io/control-plane"

  # Real node usage from metrics-server instead of pod requests.
  metricsProviders:
    - source: KubernetesMetrics

  maxNoOfPodsToEvictPerNode: 3

  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            # Only evict when another node can actually host the pod.
            nodeFit: true

        - name: RemoveDuplicates

        - name: LowNodeUtilization
          args:
            metricsUtilization:
              source: KubernetesMetrics
            # Nodes under all thresholds are underutilized (eviction targets to fill);
            # nodes over any targetThreshold are overutilized (eviction sources).
            thresholds:
              cpu: 30
              memory: 30
            targetThresholds:
              cpu: 65
              memory: 65

      plugins:
        balance:
          enabled:
            - RemoveDuplicates
            - LowNodeUtilization

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
