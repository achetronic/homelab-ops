# Ref: https://github.com/metallb/metallb/blob/main/charts/metallb/values.yaml
# Controller: Cluster-wide controller that handles IP address assignments
# Speaker: Component that speaks the protocol(s) of your choice to make the services reachable
metallb:
  speaker:
    tolerateMaster: false

  # Only L2 announcements here: the frr-k8s backend is not used
  frrk8s:
    enabled: false
