# We are using a meta Helm chart called app-template from bwj-s.
# Reference values can be inspected there.
# Ref: https://github.com/bjw-s/helm-charts/blob/main/charts/library/common/values.yaml


defaultPodOptions:
  labels: {}
  annotations: {}

controllers:

  application:
    type: deployment
    replicas: 1

    labels: {}
    annotations:
      reloader.stakater.com/auto: "true"

    initContainers:
      copy-models:
        image:
          repository: ghcr.io/achetronic/parakeet
          tag: 0.8.0-int8
          pullPolicy: IfNotPresent
        command: [ 'sh', '-c', 'cp -r /models/* /models-ram/' ]

    containers:
      main:
        image:
          repository: ghcr.io/achetronic/parakeet
          tag: 0.8.0-int8
          pullPolicy: IfNotPresent
        env:
          - name: PARAKEET_MODELS
            value: "/models-ram"
          - name: PARAKEET_LOG_LEVEL
            value: "debug"
          - name: PARAKEET_LONG_AUDIO
            value: "true"

        ports:
          - containerPort: 5092
        resources:
          requests: &resourcesRequests
            cpu: '3'
            memory: 4Gi
          limits: *resourcesRequests

service:
  backend:
    controller: application
    type: ClusterIP
    ports:
      http:
        port: 5092
        protocol: TCP

persistence:
  models-ram:
    type: emptyDir
    medium: Memory
    sizeLimit: 3Gi # Adjust for the real size of the models
    globalMounts:
      - path: /models-ram
