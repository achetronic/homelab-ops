---
version: "3"

vars:
  HELM_VERSION: "v4.3.2"

tasks:

  install-cli:
    internal: true
    desc: Install Helm (task helm:install-cli)
    cmds:
      - wget -O /tmp/helm.tar.gz https://get.helm.sh/helm-{{ .HELM_VERSION }}-linux-amd64.tar.gz

      - tar -xvf /tmp/helm.tar.gz -C /tmp
      - sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
      - sudo chmod +x /usr/local/bin/helm
    status:
      - |
        if [[ "$(helm version --short 2>/dev/null | cut -d+ -f1)" = "{{ .HELM_VERSION }}" ]]; then exit 0; else exit 1; fi

